<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="sunGradient" cx="50%" cy="50%" r="60%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#fff176"/>
      <stop offset="70%" style="stop-color:#ffa726"/>
      <stop offset="100%" style="stop-color:#ef6c00"/>
    </radialGradient>
    <filter id="sunGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Güneş gövdesi -->
  <circle cx="100" cy="100" r="60" fill="url(#sunGradient)" filter="url(#sunGlow)"/>
  
  <!-- Güneş koronası -->
  <g transform="translate(100, 100)">
    <!-- 12 adet güneş ışını -->
    <line x1="0" y1="-80" x2="0" y2="-110" stroke="#ffcc80" stroke-width="3"/>
    <line x1="40" y1="-69.3" x2="55" y2="-95.3" stroke="#ffcc80" stroke-width="3"/>
    <line x1="69.3" y1="-40" x2="95.3" y2="-55" stroke="#ffcc80" stroke-width="3"/>
    <line x1="80" y1="0" x2="110" y2="0" stroke="#ffcc80" stroke-width="3"/>
    <line x1="69.3" y1="40" x2="95.3" y2="55" stroke="#ffcc80" stroke-width="3"/>
    <line x1="40" y1="69.3" x2="55" y2="95.3" stroke="#ffcc80" stroke-width="3"/>
    <line x1="0" y1="80" x2="0" y2="110" stroke="#ffcc80" stroke-width="3"/>
    <line x1="-40" y1="69.3" x2="-55" y2="95.3" stroke="#ffcc80" stroke-width="3"/>
    <line x1="-69.3" y1="40" x2="-95.3" y2="55" stroke="#ffcc80" stroke-width="3"/>
    <line x1="-80" y1="0" x2="-110" y2="0" stroke="#ffcc80" stroke-width="3"/>
    <line x1="-69.3" y1="-40" x2="-95.3" y2="-55" stroke="#ffcc80" stroke-width="3"/>
    <line x1="-40" y1="-69.3" x2="-55" y2="-95.3" stroke="#ffcc80" stroke-width="3"/>
  </g>
</svg>
