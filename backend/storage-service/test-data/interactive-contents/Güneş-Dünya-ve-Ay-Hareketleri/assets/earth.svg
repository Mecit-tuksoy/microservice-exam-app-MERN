  <path d="M170,70 C180,80 175,100 160,110 C145,120 155,130 150,150 C145,170 130,160 120,150 C110,140 120,130 130,120 C140,110 150,90 170,70" fill="url(#landGradient)" opacity="0.8"/>
  
  <!-- Eksen Çizgisi -->
