<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150">
  <defs>
    <radialGradient id="dayGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#ffeb3b"/>
      <stop offset="100%" style="stop-color:#ff9800"/>
    </radialGradient>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1976d2"/>
      <stop offset="50%" style="stop-color:#1565c0"/>
      <stop offset="100%" style="stop-color:#0d47a1"/>
    </linearGradient>
  </defs>
  
  <!-- Arka plan -->
  <rect x="0" y="0" width="300" height="150" fill="#000"/>
  
  <!-- Dünya -->
  <circle cx="150" cy="75" r="60" fill="url(#skyGradient)"/>
  
  <!-- Gündüz yarısı -->
  <path d="M150,15 A60,60 0 0,1 150,135 A60,60 0 0,1 150,15" fill="#4caf50"/>
  
  <!-- Gece yarısı -->
  <path d="M150,15 A60,60 0 0,0 150,135 A60,60 0 0,0 150,15" fill="#263238"/>
  
  <!-- Terminator çizgisi (gündüz ve gece arası sınır) -->
  <line x1="150" y1="15" x2="150" y2="135" stroke="#ffffff" stroke-width="2" stroke-dasharray="5,3"/>
  
  <!-- Güneş ışığı -->
  <path d="M0,75 L90,75" stroke="#ffeb3b" stroke-width="2" stroke-dasharray="5,3"/>
  <path d="M60,45 L90,75" stroke="#ffeb3b" stroke-width="2" stroke-dasharray="5,3"/>
  <path d="M60,105 L90,75" stroke="#ffeb3b" stroke-width="2" stroke-dasharray="5,3"/>
  
  <!-- Güneş -->
  <circle cx="30" cy="75" r="20" fill="url(#dayGradient)"/>
  
  <!-- Dönme oku -->
  <path d="M150,75 C160,45 190,35 210,55 C230,75 210,105 180,105" stroke="#ffffff" stroke-width="2" fill="none"/>
  <polygon points="175,108 180,105 177,100" fill="#ffffff"/>
  
  <!-- Etiketler -->
  <text x="30" y="20" fill="#ffffff" font-family="Arial" font-size="12" text-anchor="middle">Güneş</text>
  <text x="120" y="70" fill="#ffffff" font-family="Arial" font-size="12">Gece</text>
  <text x="180" y="70" fill="#ffffff" font-family="Arial" font-size="12">Gündüz</text>
  <text x="210" y="50" fill="#ffffff" font-family="Arial" font-size="10" text-anchor="middle">Dönme yönü</text>
</svg>
