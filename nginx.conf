events { }

http {
  upstream auth      { server auth-service:3001; }
  upstream analytics { server analytics-service:3002; }
  upstream storage   { server storage-service:3003; }
  upstream test      { server test-service:3004; }
  upstream frontend  { server frontend:4000; }

  server {
    listen 80;

    # Auth service
    location /api/auth/ {
      proxy_pass http://auth/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Analytics service
    location /api/analytics/ {
      proxy_pass http://analytics/api/analytics/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Storage service API
    location /api/storage/ {
      proxy_pass http://storage;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Storage service static files (images, etc.)
    location ~ ^/api/storage/interactive-contents/.+\.(jpg|jpeg|png|gif|svg|webp|pdf|mp4|mp3|wav)$ {
      proxy_pass http://storage;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Test service
    location /api/tests/ {
      proxy_pass http://test/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Frontend (React build)
    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
